apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-todo-app-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/djblackett/k8s-todo-dep
    path: manifests/overlays/production
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated: # Would set to true in production, but inconvenient for dev and testing
      prune: false
      selfHeal: false
